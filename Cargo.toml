[package]
name = "patchwork"
version = "0.2.0"
edition = "2024"
description = "A small, diff-based terminal UI toolkit for Rust built on libc."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheCloudlet/Patchwork"
keywords = ["terminal", "tui", "ansi", "cli"]
categories = ["command-line-interface"]

[lib]
# staticlib so the FFI demo in examples/ can link against pw_* symbols from
# a C/C++ toolchain; rlib (Rust-only) stays too since src/main.rs needs it.
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"
